# 역할별 모델 (DESIGN.md 7.2·7.6절). 모델 ID를 코드에 쓰지 않고 여기서만 바꾼다.
# saveMode: 월 예산을 다 쓰면 이 모델로 바꿔서 실행 (DESIGN.md 7.5절 ⑤)
triage:
