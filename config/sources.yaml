# 수집 소스. weight: 신뢰도 가중치(0~1.5), enabled: false면 수집하지 않음.
# type: rss | arxiv | hf_papers | hackernews
# kind: news | paper | community | release (브리핑 분류의 참고값. 최종 분류는 LLM이 정함)

sources:
  # 랩 공식 블로그
  - { id: openai, name: OpenAI News, type: rss, kind: news, url: "https://openai.com/news/rss.xml", weight: 1.3 }
  # Anthropic은 공식 RSS가 없어 꺼둠(404). HTML 목록 수집기를 만들면 켠다.
  - { id: anthropic, name: Anthropic News, type: rss, kind: news, url: "https://www.anthropic.com/rss.xml", weight: 1.3, enabled: false }
  # DeepMind 피드는 가끔 HTML을 돌려줘서 실패한다. 실패해도 다른 소스는 계속 진행된다.
  - { id: deepmind, name: Google DeepMind, type: rss, kind: news, url: "https://deepmind.google/blog/rss.xml", weight: 1.2 }
  - { id: google-ai, name: Google AI Blog, type: rss, kind: news, url: "https://blog.google/technology/ai/rss/", weight: 1.1 }
  - { id: hf-blog, name: Hugging Face Blog, type: rss, kind: news, url: "https://huggingface.co/blog/feed.xml", weight: 1.1 }

  # LLM 전문 블로그
  - { id: simonw, name: Simon Willison, type: rss, kind: news, url: "https://simonwillison.net/atom/everything/", weight: 1.2 }
  - { id: latent-space, name: Latent Space, type: rss, kind: news, url: "https://www.latent.space/feed", weight: 1.0 }

  # 테크 뉴스
  - { id: techcrunch-ai, name: TechCrunch, type: rss, kind: news, url: "https://techcrunch.com/category/artificial-intelligence/feed/", weight: 0.9 }
  - { id: verge-ai, name: The Verge, type: rss, kind: news, url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml", weight: 0.8 }

  # 국내
  - { id: geeknews, name: GeekNews, type: rss, kind: community, url: "https://news.hada.io/rss/news", weight: 1.0, lang: ko, keywordFilter: true }

  # 논문
  - { id: hf-papers, name: HF Daily Papers, type: hf_papers, kind: paper, weight: 1.0 }
  - id: arxiv
    name: arXiv
    type: arxiv
    kind: paper
    weight: 0.6
    query: '(cat:cs.CL OR cat:cs.AI OR cat:cs.LG) AND (abs:agent OR abs:agentic OR abs:"tool use" OR abs:"language model")'
    maxResults: 60

  # 커뮤니티
  - id: hn
    name: Hacker News
    type: hackernews
    kind: community
    weight: 1.0
    queries: [LLM, GPT, Claude, Gemini, OpenAI, Anthropic, agent, agents, MCP, "open-weight", "language model"]
    minPoints: 60
