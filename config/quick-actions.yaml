# 질문 탭의 빠른 질문 버튼. label은 버튼 글자, prompt는 실제로 보내는 질문.
item:
  - label: 쉽게 설명
    prompt: 이 기사를 이 분야를 잘 모르는 사람도 이해할 수 있게 쉽게 설명해 줘.
  - label: 기술 디테일
    prompt: 이 기사에서 기술적으로 새로운 점과 구체적인 방법·수치를 정리해 줘.
  - label: 내 일에 적용하면?
    prompt: LLM·에이전트로 제품을 만드는 개발자 입장에서 이 소식을 어떻게 활용하거나 대비하면 좋을지 알려 줘.
  - label: 한계와 반론
    prompt: 이 기사의 주장이나 결과에서 한계, 빠진 정보, 의심해 볼 점은 뭐야?
digest:
  - label: 꼭 읽을 3개
    prompt: 오늘 브리핑에서 꼭 읽어야 할 기사 3개를 골라서 이유와 함께 알려 줘.
  - label: 오늘의 흐름
    prompt: 오늘 소식들을 관통하는 흐름을 한 문단으로 정리해 줘.
  - label: 바로 써볼 것
    prompt: 오늘 소식 중 LLM·에이전트 개발자가 이번 주에 바로 써보거나 확인해 볼 만한 것은 뭐야?
