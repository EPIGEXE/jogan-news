# Windows 설치 파일 설정. `npm run dist` → dist/Jogan-Setup-<버전>.exe
appId: com.ainews.desktop # main/index.ts의 APP_ID와 같아야 알림이 앱 이름으로 뜬다
productName: Jogan # 표시 이름. 데이터 폴더는 main/index.ts에서 예전 이름(AINews)으로 고정
copyright: Copyright © 2026 Youngmin
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# 수집 소스·모델·프롬프트 설정은 앱 밖 resources/config에 둔다 (main/index.ts의 configDir)
extraResources:
  - from: config
    to: config
  # DB 스키마 변경 SQL (Main이 시작할 때 적용)
  - from: src/backend/data/migrations
    to: migrations
# better-sqlite3는 모든 플랫폼용 바이너리가 패키지에 들어 있어 다시 빌드할 필요가 없다
npmRebuild: false
asarUnpack:
  - '**/*.node'
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false # 사용자 폴더에 설치 (관리자 권한 불필요)
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Jogan
  artifactName: Jogan-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false # 지워도 저장한 기사·메모는 남긴다
